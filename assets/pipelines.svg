<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><style>text{font-family:"Segoe UI",Arial,sans-serif}@keyframes lit{0%,18%{stroke-opacity:1;filter:drop-shadow(0 0 6px currentColor)}30%,100%{stroke-opacity:.35}}.node{animation:lit 5.4s infinite;stroke-opacity:.35}</style>
