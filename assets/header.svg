<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0b1020"><animate attributeName="stop-color" values="#0b1020;#0f1b3d;#1a1040;#0b1020" dur="10s" repeatCount="indefinite"/></stop>
<stop offset="100%" stop-color="#0e3a5f"><animate attributeName="stop-color" values="#0e3a5f;#3b1d6e;#0a4a5a;#0e3a5f" dur="10s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.07"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.name{font:800 64px 'Segoe UI',Arial,sans-serif;fill:url(#tx);animation:in 1.2s ease-out both}
.role{font:500 22px 'Courier New',monospace;fill:#cbd5e1;animation:in 1.6s .5s ease-out both}
.tag{font:600 14px 'Courier New',monospace;fill:#38bdf8;animation:in 1.6s 1s ease-out both}
.sym{font:700 28px 'Courier New',monospace;fill:#38bdf8;opacity:.35}
@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.f1{animation:float 5s ease-in-out infinite}.f2{animation:float 7s ease-in-out infinite 1s}.f3{animation:float 6s ease-in-out infinite 2s}.f4{animation:float 8s ease-in-out infinite .5s}
@keyframes scan{from{transform:translateY(-320px)}to{transform:translateY(320px)}}
.scan{animation:scan 6s linear infinite}
</style>
<rect width="1000" height="320" fill="url(#bg)"/>
<rect width="1000" height="320" fill="url(#grid)"/>
<rect class="scan" width="1000" height="60" fill="#38bdf8" opacity="0.05"/>
<circle cx="120" cy="80" r="70" fill="#38bdf8" opacity=".08" class="f1"/>
<circle cx="880" cy="240" r="90" fill="#a78bfa" opacity=".1" class="f2"/>
<circle cx="820" cy="70" r="40" fill="#34d399" opacity=".1" class="f3"/>
<g><text class="sym f1" x="70" y="250">&lt;/&gt;</text><text class="sym f2" x="880" y="90">{ }</text><text class="sym f3" x="760" y="280">AI</text><text class="sym f4" x="180" y="60">Flutter</text><text class="sym f2" x="640" y="45">RAG</text><text class="sym f4" x="40" y="150">Kt</text></g>
<g filter="url(#glow)"><text class="name" x="500" y="150" text-anchor="middle">Huzaifa Ahmad</text></g>
<text class="role" x="500" y="195" text-anchor="middle">Mobile Application Developer  |  AI Engineer</text>
<text class="tag" x="500" y="240" text-anchor="middle">Flutter · React Native · Kotlin · LLMs · RAG · MCP</text>
<rect x="400" y="262" width="200" height="3" rx="2" fill="url(#tx)"><animate attributeName="width" values="0;200;0" dur="4s" repeatCount="indefinite"/><animate attributeName="x" values="500;400;500" dur="4s" repeatCount="indefinite"/></rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
