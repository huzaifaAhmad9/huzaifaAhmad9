<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" xmlns:c2pa="http://c2pa.org/manifest">
<style>.t{font:800 24px "Segoe UI",Arial,sans-serif;fill:#f1f5f9}.s{font:600 13px "Segoe UI",Arial,sans-serif;fill:#94a3b8}.d{font:500 14px "Segoe UI",Arial,sans-serif;fill:#cbd5e1}.m{font:800 34px "Segoe UI",Arial,sans-serif}.ml{font:600 12px "Segoe UI",Arial,sans-serif;fill:#94a3b8}.c{font:600 12px "Segoe UI",Arial,sans-serif}.i{font:800 18px "Segoe UI",Arial,sans-serif;fill:#0d1117}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}@keyframes run{to{stroke-dashoffset:-1000}}@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.card{animation:up .8s both}.run{stroke-dasharray:120 880;animation:run 6s linear infinite}.ic{animation:pop 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}</style>
