<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="100%" xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<style>
.n{font:800 40px 'Segoe UI',Arial,sans-serif;fill:url(#g)}.l{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
.card{fill:#0d1117;stroke:#30363d;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke:#30363d}50%{stroke:#38bdf8}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.a1{animation:up .8s .1s both}.a2{animation:up .8s .3s both}.a3{animation:up .8s .5s both}.a4{animation:up .8s .7s both}
</style>
<g class="a1"><rect class="card" x="10" y="10" width="230" height="130" rx="14"/><text class="n" x="125" y="73" text-anchor="middle">2+</text><text class="l" x="125" y="108" text-anchor="middle">Years Experience</text></g>
<g class="a2"><rect class="card" x="262" y="10" width="230" height="130" rx="14" style="animation-delay:.5s"/><text class="n" x="377" y="73" text-anchor="middle">0.8164</text><text class="l" x="377" y="108" text-anchor="middle">R² · EstateAI Model</text></g>
<g class="a3"><rect class="card" x="514" y="10" width="230" height="130" rx="14" style="animation-delay:1s"/><text class="n" x="629" y="73" text-anchor="middle">70%</text><text class="l" x="629" y="108" text-anchor="middle">Faster Emergency Care</text></g>
<g class="a4"><rect class="card" x="766" y="10" width="224" height="130" rx="14" style="animation-delay:1.5s"/><text class="n" x="878" y="73" text-anchor="middle">3.63</text><text class="l" x="878" y="108" text-anchor="middle">CGPA · BS Software Eng.</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
