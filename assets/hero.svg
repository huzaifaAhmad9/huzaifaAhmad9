<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a16"/><stop offset="1" stop-color="#0d1130"/></linearGradient>
<linearGradient id="gt" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
<clipPath id="scr"><rect x="710" y="62" width="160" height="316" rx="26"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.mono{font-family:'Courier New',monospace}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,40px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-30px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes tag{0%,2%{opacity:0}6%,28%{opacity:1}33%,100%{opacity:0}}
@keyframes b1{0%,6%{opacity:0;transform:translateY(10px)}10%,90%{opacity:1;transform:none}97%,100%{opacity:0}}
@keyframes b2{0%,34%{opacity:0;transform:translateY(10px)}39%,90%{opacity:1;transform:none}97%,100%{opacity:0}}
@keyframes b3{0%,54%{opacity:0;transform:translateY(10px)}59%,90%{opacity:1;transform:none}97%,100%{opacity:0}}
@keyframes dots{0%,13%{opacity:0}16%,32%{opacity:1}35%,100%{opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blob1{animation:drift1 12s ease-in-out infinite}.blob2{animation:drift2 14s ease-in-out infinite}
.phone{animation:float 6s ease-in-out infinite}
.r1{animation:rise .9s .1s both}.r2{animation:rise .9s .3s both}.r3{animation:rise .9s .5s both}.r4{animation:rise .9s .7s both}
.n{animation:pulse 3s ease-in-out infinite}
.ln{stroke-dasharray:4 6;animation:flow 2s linear infinite}
.t1,.t2,.t3{animation:tag 12s infinite;opacity:0}.t2{animation-delay:4s}.t3{animation-delay:8s}
.b1{animation:b1 10s infinite;opacity:0}.b2{animation:b2 10s infinite;opacity:0}.b3{animation:b3 10s infinite;opacity:0}.dt{animation:dots 10s infinite;opacity:0}
.d1,.d2,.d3{animation:bounce .7s ease-in-out infinite}.d2{animation-delay:.12s}.d3{animation-delay:.24s}
.chip{animation:float 5s ease-in-out infinite}
</style>
<rect width="1000" height="440" fill="url(#bg)"/>
<g filter="url(#blur)"><circle class="blob1" cx="180" cy="120" r="120" fill="#38bdf8" opacity=".28"/><circle class="blob2" cx="520" cy="380" r="130" fill="#a78bfa" opacity=".25"/><circle class="blob1" cx="860" cy="90" r="110" fill="#f472b6" opacity=".2"/></g>
<rect width="1000" height="440" fill="url(#grid)"/>

<!-- neural net -->
<g stroke="#38bdf8" stroke-opacity=".28" fill="none">
<path class="ln" d="M575 120L640 150M575 120L640 240M575 120L640 330M575 200L640 150M575 200L640 240M575 200L640 330M575 280L640 150M575 280L640 240M575 280L640 330M575 360L640 150M575 360L640 240M575 360L640 330"/>
<path class="ln" d="M640 150L700 200M640 240L700 220M640 330L700 250"/>
</g>
<g fill="#38bdf8">
<circle class="n" cx="575" cy="120" r="5"/><circle class="n" style="animation-delay:.4s" cx="575" cy="200" r="5"/><circle class="n" style="animation-delay:.8s" cx="575" cy="280" r="5"/><circle class="n" style="animation-delay:1.2s" cx="575" cy="360" r="5"/>
<circle class="n" style="animation-delay:.6s" cx="640" cy="150" r="6" fill="#a78bfa"/><circle class="n" style="animation-delay:1s" cx="640" cy="240" r="6" fill="#a78bfa"/><circle class="n" style="animation-delay:1.4s" cx="640" cy="330" r="6" fill="#a78bfa"/>
</g>

<!-- text -->
<g class="r1"><rect x="50" y="52" width="150" height="28" rx="14" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".6"/><circle class="n" cx="68" cy="66" r="4.5" fill="#22c55e"/><text x="82" y="71" font-size="12" font-weight="700" fill="#4ade80" letter-spacing="1">OPEN TO WORK</text></g>
<text class="r2" x="50" y="128" font-size="22" fill="#94a3b8">Hi, I'm</text>
<text class="r2" x="50" y="190" font-size="62" font-weight="800" fill="url(#gt)">Huzaifa Ahmad</text>
<text class="r3" x="50" y="238" font-size="26" font-weight="600" fill="#f1f5f9">Mobile Application Developer</text>
<text class="r3" x="50" y="270" font-size="26" font-weight="600" fill="url(#gt)">&amp; AI Engineer</text>
<g class="mono r4" font-size="16" fill="#38bdf8">
<text class="t1" x="50" y="324">&gt; Flutter · React Native · Kotlin</text>
<text class="t2" x="50" y="324">&gt; LLMs · RAG · AI Agents · MCP</text>
<text class="t3" x="50" y="324">&gt; Play Store &amp; App Store releases</text>
</g>
<text class="r4" x="50" y="378" font-size="13" fill="#64748b">Lahore, Pakistan  ·  Associate Software Engineer @ Glixen Technologies</text>

<!-- phone -->
<g class="phone">
<rect x="700" y="50" width="180" height="340" rx="34" fill="#0b1020" stroke="url(#gt)" stroke-width="3"/>
<rect x="710" y="62" width="160" height="316" rx="26" fill="#0f172a"/>
<g clip-path="url(#scr)">
<rect x="710" y="62" width="160" height="50" fill="url(#gt)" opacity=".25"/>
<circle cx="732" cy="96" r="9" fill="url(#gt)"/><text x="748" y="100" font-size="12" font-weight="700" fill="#fff">DocChat AI</text>
<g class="b1"><rect x="765" y="128" width="95" height="28" rx="12" fill="#38bdf8"/><text x="812" y="146" font-size="10.5" font-weight="600" fill="#0b1020" text-anchor="middle">Summarize my PDF</text></g>
<g class="dt"><rect x="720" y="170" width="46" height="24" rx="12" fill="#1e293b"/><circle class="d1" cx="732" cy="182" r="3" fill="#94a3b8"/><circle class="d2" cx="743" cy="182" r="3" fill="#94a3b8"/><circle class="d3" cx="754" cy="182" r="3" fill="#94a3b8"/></g>
<g class="b2"><rect x="720" y="170" width="138" height="62" rx="12" fill="#1e293b"/><text x="730" y="190" font-size="10.5" fill="#e2e8f0">Here's a cited summary</text><text x="730" y="206" font-size="10.5" fill="#94a3b8">based on your document,</text><text x="730" y="222" font-size="10.5" fill="#94a3b8">grounded in 3 sources.</text></g>
<g class="b3"><rect x="720" y="244" width="30" height="20" rx="10" fill="#a78bfa" fill-opacity=".25" stroke="#a78bfa"/><text x="735" y="258" font-size="10" fill="#c4b5fd" text-anchor="middle">[1]</text><rect x="756" y="244" width="30" height="20" rx="10" fill="#a78bfa" fill-opacity=".25" stroke="#a78bfa"/><text x="771" y="258" font-size="10" fill="#c4b5fd" text-anchor="middle">[2]</text><rect x="792" y="244" width="30" height="20" rx="10" fill="#a78bfa" fill-opacity=".25" stroke="#a78bfa"/><text x="807" y="258" font-size="10" fill="#c4b5fd" text-anchor="middle">[3]</text></g>
<rect x="720" y="342" width="140" height="28" rx="14" fill="#1e293b"/><text x="734" y="360" font-size="10.5" fill="#64748b">Ask anything...</text><circle cx="846" cy="356" r="10" fill="url(#gt)"/>
</g>
<rect x="768" y="56" width="44" height="8" rx="4" fill="#060a16"/>
</g>

<!-- floating chips -->
<g class="chip"><rect x="895" y="95" width="80" height="30" rx="15" fill="#0d1117" stroke="#38bdf8"/><text x="935" y="115" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Flutter</text></g>
<g class="chip" style="animation-delay:1.2s"><rect x="905" y="190" width="62" height="30" rx="15" fill="#0d1117" stroke="#a78bfa"/><text x="936" y="210" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">RAG</text></g>
<g class="chip" style="animation-delay:2.4s"><rect x="893" y="290" width="84" height="30" rx="15" fill="#0d1117" stroke="#f472b6"/><text x="935" y="310" font-size="13" font-weight="700" fill="#f472b6" text-anchor="middle">Kotlin</text></g>
<g class="chip" style="animation-delay:.6s"><rect x="470" y="395" width="70" height="28" rx="14" fill="#0d1117" stroke="#34d399"/><text x="505" y="414" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">LLMs</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
